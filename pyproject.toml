[project]
name = "tuition-fee-agents"
version = "0.1.0"
description = "Local-first, multi-agent system that reconciles PayPal/bank payments against tuition enrollments and drafts parent reminders with human approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.28",
    "langchain-anthropic>=0.1",
    "langgraph>=0.2",
    "mcp[cli]>=1.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuition"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
