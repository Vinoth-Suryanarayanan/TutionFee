# A generic, single database configuration.
# The actual database URL is injected from .env in alembic/env.py —
# the placeholder here is overridden at runtime.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# overridden in alembic/env.py via get_settings().database_url
sqlalchemy.url = postgresql+psycopg://tuition:tuition@localhost:5432/tuition

[post_write_hooks]
# hooks to run after generating revision files: none for now

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
